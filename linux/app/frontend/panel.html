<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Flock</title>
<link rel="stylesheet" href="app.css">
<style>
  body { overflow: auto; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
  header img { width: 30px; height: 30px; }
  header h1 { margin: 0; font-size: 15px; }
  section { padding: 4px 14px 10px; }
  section h3 { margin: 6px 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .item { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .item .detail { color: var(--muted); font-size: 12px; }
  .site { cursor: pointer; border-radius: 6px; padding: 4px 6px; margin: 0 -6px; }
  .site:hover { background: var(--bg-2); }
  .sites { max-height: 240px; overflow: hidden auto; }
  .toggle { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
  .shortcuts { display: flex; gap: 8px; padding: 8px 14px; }
  .shortcuts button { flex: 1; }
  footer { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
  .warning { color: var(--warn); }
  .proc-error { color: var(--bad); font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <img src="icon.png" alt="">
  <div class="grow">
    <h1 id="headline">Flock</h1>
    <div id="subline" class="muted"></div>
  </div>
</header>
<div id="error" class="error" hidden></div>
<div id="content"></div>
<footer>
  <button id="restart">Restart</button>
  <button id="settings">Settings…</button>
  <span class="grow"></span>
  <button id="quit">Quit</button>
</footer>

<script type="module">
import { api, app, h, openURL, openWindow, poll } from "./app.js";

const $ = (id) => document.getElementById(id);
let busy = false;

function showError(err) {
  $("error").hidden = !err;
  $("error").textContent = err ? err.message || String(err) : "";
}

async function act(fn) {
  showError(null);
  try {
    await fn();
  } catch (err) {
    showError(err);
  }
  refresh();
}

function toggle(label, on, setting) {
  const box = h("input", { type: "checkbox", checked: on });
  box.addEventListener("change", () => act(() => api("/v1/settings", { method: "POST", body: { [setting]: box.checked } })));
  return h("label", { class: "toggle" }, label, box);
}

function item(state, name, detail) {
  return h("div", { class: "item" }, h("span", { class: "dot " + state }), h("span", { class: "grow" }, name), h("span", { class: "detail mono" }, detail));
}

function render(st) {
  $("headline").textContent = st.warnings?.length ? "Needs attention" : "Running";
  $("subline").textContent = `${/^\d/.test(st.version) ? "v" : ""}${st.version} · pid ${st.pid}`;

  const procs = st.processes || [];
  const dns = st.dns || {};

  const services = [
    item("ok", "Web", `http :${st.http_port} · https :${st.https_port}`),
    item(dns.wildcard ? "ok" : "warn", `DNS *.${dns.tld}`, dns.wildcard ? dns.addr : "not resolving"),
    item(st.mail ? "ok" : "bad", "Mail", st.mail || "stopped"),
    st.postgres && item("ok", "PostgreSQL", st.postgres),
    st.valkey && item("ok", "Valkey", st.valkey),
    ...(st.extras || []).filter((e) => e.enabled).map((e) => item(e.up ? "ok" : "bad", e.name, `${e.version} :${e.port}`)),
    ...procs.filter((p) => /php.*fpm/i.test(p.name)).map((p) => item(p.up ? "ok" : "bad", p.name, p.restarts ? `${p.restarts} restarts` : "")),
  ];

  const sites = (st.sites || []).map((s) =>
    h("div", { class: "item site", title: s.problem || s.path, onclick: () => openURL(s.url || `http://${s.domain}`) },
      h("span", { class: "dot " + (s.problem ? "warn" : "ok") }),
      h("span", { class: "grow ellipsis" }, (s.secured ? "🔒 " : "") + s.domain),
      s.debugging && h("span", { class: "detail", title: "Xdebug is debugging this site" }, "🐞"),
      s.server === "frankenphp" && h("span", { class: "detail" }, s.worker === "octane" ? "Octane" : "FrankenPHP"),
      h("span", { class: "detail mono" }, s.php ? "PHP " + s.php : "")));

  $("content").replaceChildren(
    st.warnings?.length ? h("section", {}, ...st.warnings.map((w) => h("div", { class: "warning" }, "⚠ " + w))) : "",
    h("section", {}, h("h3", {}, "Services"), ...services,
      ...procs.filter((p) => !p.up).map((p) => h("div", { class: "proc-error" }, `${p.name}: ${p.last_error || "not running"}`))),
    h("section", {}, h("h3", {}, `Sites (${sites.length})`),
      sites.length ? h("div", { class: "sites" }, ...sites) : h("div", { class: "muted" }, "Run `flock-php park` in your projects folder, or `flock-php link` in a project.")),
    h("section", {},
      toggle("Xdebug for requests that ask for it", st.xdebug, "xdebug"),
      toggle("Capture dump() and events", st.dumps, "dumps")),
    h("div", { class: "shortcuts" },
      h("button", { onclick: () => openWindow("mail") }, "Mail ", st.mail_count ? h("span", { class: "badge" }, st.mail_count) : ""),
      h("button", { onclick: () => openWindow("logs") }, "Logs"),
      h("button", { onclick: () => openWindow("dumps") }, "Dumps")));
}

function renderStopped(installed, message) {
  $("subline").textContent = "";
  if (!installed) {
    $("headline").textContent = "Not set up";
    $("content").replaceChildren(h("section", {},
      h("p", {}, "Flock isn't set up for your user yet. In a terminal, run:"),
      h("pre", { class: "mono" }, "flock-php install"),
      h("p", { class: "muted" }, "It asks for your password once, for .test DNS, the HTTPS certificate authority and ports 80 and 443.")));
    return;
  }
  $("headline").textContent = "Not running";
  $("content").replaceChildren(h("section", {},
    h("p", { class: "muted" }, message),
    h("button", { class: "primary", onclick: (e) => restart(e.target, "Starting…") }, "Start Flock")));
}

async function restart(button, label) {
  const text = button.textContent;
  busy = true;
  button.disabled = true;
  button.textContent = label;
  await act(() => app("restart"));
  busy = false;
  button.disabled = false;
  button.textContent = text;
}

async function refresh() {
  try {
    render(await api("/v1/status"));
  } catch (err) {
    if (busy) return;
    renderStopped((await fetch("/app/installed")).ok, err.message);
  }
}

$("restart").onclick = () => restart($("restart"), "Restarting…");
$("quit").onclick = () => app("quit");
$("settings").onclick = () => openWindow("settings");

poll(refresh);
</script>
</body>
</html>
